<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>그림자 서약 — Shadow's Oath</title>
<style>
:root{
  --void:#0b0718; --panel:#1a1030; --panel2:#241640;
  --gold:#ffcf3f; --gold2:#e0900f; --purple:#8b3ff7; --purple-lt:#b678ff;
  --teal:#22d3c5; --green:#5ce67a; --blood:#ff3b6b; --crimson:#e01046;
  --text:#f3edff; --dim:#b3a6d4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#05030c;color:var(--text);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
#game{position:relative;width:min(440px,100vw);height:100vh;max-height:920px;margin:0 auto;background:var(--void);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.8);}
img{display:block;} button{font-family:inherit;cursor:pointer;color:inherit;}

/* 배경 씬 */
.scene{position:absolute;inset:0;z-index:0;overflow:hidden;}
.scene .bg{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:saturate(1.05);animation:bgdrift 22s ease-in-out infinite alternate;}
@keyframes bgdrift{from{transform:scale(1.03) translateX(-1%);}to{transform:scale(1.09) translateX(1%);}}
.scene .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,7,24,.28),rgba(11,7,24,.5) 50%,rgba(11,7,24,.9));}
.scene .vig{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px rgba(0,0,0,.82);}

/* 상단바 */
#topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;pointer-events:none;}
.stage-pill{background:linear-gradient(180deg,#241640,#120a24);border:3px solid #000;font-size:12px;color:var(--gold);padding:6px 14px;border-radius:16px;font-weight:800;box-shadow:0 3px 0 #000;letter-spacing:.02em;}
.pill{display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,#2b1a52,#160c2c);border:3px solid #000;border-radius:16px;padding:4px 11px 4px 5px;box-shadow:0 3px 0 #000;font-weight:900;}
.pill .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;}
.ic-gold{background:radial-gradient(circle at 40% 30%,#ffe27a,#e0900f);}
.ic-gem{background:radial-gradient(circle at 40% 30%,#b678ff,#6a24c7);}
.pill .val{font-size:13px;color:#fff;text-shadow:0 1px 0 #000;}

/* 전투 무대 */
#arena{position:absolute;inset:0;bottom:206px;z-index:8;}
/* 스탯 박스 (포켓몬식) */
.statbox{position:absolute;z-index:12;background:linear-gradient(180deg,rgba(32,20,60,.94),rgba(16,9,34,.94));border:3px solid #000;border-radius:14px;padding:7px 11px 8px;box-shadow:0 4px 0 #000,inset 0 2px 0 rgba(255,255,255,.08);min-width:172px;}
#enemy-box{top:58px;left:12px;}
#hero-box{right:12px;bottom:8px;}
.sb-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;}
.sb-name{font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 0 #000;}
.sb-lv{font-size:11px;font-weight:800;color:var(--gold);background:#120a24;border:2px solid #000;border-radius:8px;padding:0 6px;}
.hpbar{height:11px;border-radius:6px;background:rgba(0,0,0,.6);border:2px solid #000;overflow:hidden;}
.hpbar>i{display:block;height:100%;width:100%;background:linear-gradient(180deg,#ff6b8a,var(--crimson));transition:width .45s cubic-bezier(.4,0,.2,1);}
.hpbar.mp{margin-top:4px;height:8px;}
.hpbar.mp>i{background:linear-gradient(180deg,#7cf,#3a7ff7);}
.sb-bot{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:var(--dim);margin-top:3px;}
.sb-bot .hptext{color:#fff;}

/* 파이터 슬롯 */
.slot{position:absolute;z-index:9;display:flex;flex-direction:column;align-items:center;}
#enemy-slot{top:96px;left:6%;}
#hero-slot{bottom:2px;right:4%;}
.platform{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:150px;height:34px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(139,63,247,.4),rgba(139,63,247,.08) 55%,transparent 72%);filter:blur(1px);}
#enemy-sprite{width:184px;height:184px;position:relative;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7));animation:efloat 3.4s ease-in-out infinite;}
@keyframes efloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
#enemy-sprite.hit{animation:ehit .34s;}
@keyframes ehit{0%,100%{transform:translateX(0);}25%{transform:translateX(-14px) rotate(-4deg);}75%{transform:translateX(14px) rotate(4deg);}}
#enemy-sprite.dead{animation:edead .8s forwards;}
@keyframes edead{to{opacity:0;transform:translateY(24px) scale(.7) rotate(10deg);filter:brightness(3) blur(4px);}}
#hero-card{width:172px;height:214px;position:relative;}
#hero-img{width:100%;height:100%;object-fit:cover;object-position:top center;
  -webkit-mask:radial-gradient(ellipse 60% 72% at 50% 40%,#000 50%,rgba(0,0,0,.35) 72%,transparent 86%);
  mask:radial-gradient(ellipse 60% 72% at 50% 40%,#000 50%,rgba(0,0,0,.35) 72%,transparent 86%);
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));animation:hfloat 4s ease-in-out infinite;}
@keyframes hfloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
#hero-card.hit{animation:ehit .3s;}

/* 데미지 팝업 */
.dmg{position:absolute;z-index:25;font-family:'Cinzel',serif;font-weight:900;font-size:30px;pointer-events:none;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8);animation:dpop 1s forwards;}
.dmg.crit{font-size:42px;color:var(--gold);}
.dmg.heal{color:var(--green);} .dmg.mine{color:#ff8aa5;}
@keyframes dpop{0%{transform:translateY(0) scale(.4);opacity:0;}20%{transform:translateY(-14px) scale(1.15);opacity:1;}70%{transform:translateY(-30px) scale(1);opacity:1;}100%{transform:translateY(-56px) scale(.9);opacity:0;}}
#flash{position:absolute;inset:0;z-index:26;pointer-events:none;background:#fff;opacity:0;}
#flash.on{animation:fl .3s;} @keyframes fl{0%{opacity:.5;}100%{opacity:0;}}
#game.shake{animation:shk .3s;} @keyframes shk{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}60%{transform:translateX(6px);}}

/* 하단 텍스트/커맨드 박스 (포켓몬식) */
#textbox{position:absolute;left:0;right:0;bottom:0;height:206px;z-index:20;background:linear-gradient(180deg,#20143c,#0c0820);border-top:4px solid var(--gold2);box-shadow:0 -6px 20px rgba(0,0,0,.5);padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;}
#msg{background:linear-gradient(180deg,#120a24,#0a0618);border:3px solid #000;border-radius:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);padding:11px 14px;min-height:58px;font-size:15px;font-weight:700;line-height:1.45;color:#fff;display:flex;align-items:center;}
#msg.big{color:var(--gold);font-weight:900;}
#cmd{flex:1;}
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;height:100%;}
.cbtn{border:4px solid #000;border-radius:15px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 5px 0 #000,inset 0 2px 0 rgba(255,255,255,.1);color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;}
.cbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #000;}
.cbtn .ci{font-size:19px;}
.cbtn.fight{background:linear-gradient(180deg,#e0900f,#a85e00);}
.cbtn.bag{background:linear-gradient(180deg,#3a4a7a,#1a2a50);}
.cbtn.guard{background:linear-gradient(180deg,#2a7a6a,#155048);}
.cbtn.flee{background:linear-gradient(180deg,#4a3a5a,#241630);}
.cbtn:disabled{filter:grayscale(.7) brightness(.6);}
/* 기술 목록 */
.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:100%;}
.mbtn{border:3px solid #000;border-radius:13px;background:linear-gradient(180deg,#2a1a52,#160c2c);box-shadow:0 4px 0 #000;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;text-align:left;transition:transform .08s;}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000;}
.mbtn .mn{font-weight:900;font-size:14px;color:#fff;line-height:1.1;}
.mbtn .md{font-size:9.5px;color:var(--dim);margin-top:2px;}
.mbtn .mc{font-size:10px;font-weight:900;color:var(--teal);margin-top:2px;}
.mbtn.basic .mn{color:var(--gold);}
.mbtn:disabled{filter:grayscale(.6) brightness(.55);}
.mback{grid-column:1 / -1;border:3px solid #000;border-radius:12px;background:#160c2c;color:var(--dim);font-weight:900;font-size:13px;padding:7px;}

/* 오버레이 화면들 */
.screen{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;}
.screen.show{display:flex;}
.screen .scene{z-index:-1;}
#title h1{font-family:'Cinzel',serif;font-weight:900;font-size:42px;letter-spacing:.05em;color:#fff;text-shadow:0 3px 0 #000,0 0 30px rgba(139,63,247,.9);line-height:1.1;}
#title .en{font-size:15px;color:var(--gold);letter-spacing:.35em;margin-top:6px;font-weight:800;}
#title .desc{color:var(--dim);font-size:13px;margin:22px 0 30px;line-height:1.7;max-width:320px;}
.bigbtn{border:5px solid #000;border-radius:22px;background:linear-gradient(180deg,#ffe27a,#f0a81a 55%,#c8790a);box-shadow:0 8px 0 #7a4a00,0 12px 20px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.5);padding:16px 44px;transition:transform .1s;}
.bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 #7a4a00;}
.bigbtn .m{font-family:'Cinzel',serif;font-weight:900;font-size:26px;color:#5a2b00;}
.bigbtn .s{font-size:12px;font-weight:900;color:#7a4a00;letter-spacing:.1em;}
.story-panel{background:rgba(10,6,22,.85);border:3px solid #000;border-radius:18px;padding:22px;max-width:360px;box-shadow:0 8px 0 #000,inset 0 0 30px rgba(139,63,247,.15);}
.story-panel .rgn{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;letter-spacing:.2em;font-weight:800;}
.story-panel .rgn-kr{font-size:24px;font-weight:900;color:#fff;margin:4px 0 14px;text-shadow:0 2px 0 #000;}
.story-panel p{color:var(--text);font-size:14px;line-height:1.85;}
.evo-hero{width:170px;height:230px;position:relative;margin-bottom:16px;animation:evoIn 1s;}
.evo-hero img{width:100%;height:100%;object-fit:cover;object-position:top center;-webkit-mask:radial-gradient(ellipse 60% 72% at 50% 40%,#000 52%,transparent 86%);mask:radial-gradient(ellipse 60% 72% at 50% 40%,#000 52%,transparent 86%);filter:drop-shadow(0 0 30px rgba(139,63,247,.8));}
@keyframes evoIn{0%{transform:scale(.6) rotate(-6deg);opacity:0;filter:brightness(4);}100%{transform:scale(1);opacity:1;}}
.evo-rays{position:absolute;width:340px;height:340px;background:conic-gradient(from 0deg,transparent 0 12deg,rgba(255,207,63,.16) 12deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(transparent 34%,#000 60%,transparent 82%);mask:radial-gradient(transparent 34%,#000 60%,transparent 82%);animation:spin 30s linear infinite;z-index:-1;}
@keyframes spin{to{transform:rotate(360deg);}}
.big-title{font-family:'Cinzel',serif;font-weight:900;font-size:30px;color:var(--gold);text-shadow:0 3px 0 #000,0 0 26px rgba(139,63,247,.9);}
.sub-title{color:#fff;font-size:20px;font-weight:900;margin-top:6px;}
.note{color:var(--dim);font-size:13px;margin:16px 0 26px;line-height:1.7;max-width:320px;}
#gameover .big-title{color:var(--crimson);}
.tap-hint{color:var(--dim);font-size:12px;margin-top:20px;animation:blink 1.3s infinite;}
@keyframes blink{50%{opacity:.3;}}
</style>
</head>
<body>
<div id="game">
  <div class="scene" id="scene"><img class="bg" id="scene-bg" alt=""><div class="tint"></div><div class="vig"></div></div>

  <div id="topbar">
    <div class="stage-pill" id="stage-pill">잊혀진 숲</div>
    <div style="display:flex;gap:6px;">
      <div class="pill"><span class="ic ic-gold">🪙</span><span class="val" id="ui-gold">0</span></div>
      <div class="pill"><span class="ic ic-gem">✦</span><span class="val" id="ui-gem">0</span></div>
    </div>
  </div>

  <div id="arena">
    <!-- 적 -->
    <div class="statbox" id="enemy-box">
      <div class="sb-top"><span class="sb-name" id="enemy-name">타락 천사</span><span class="sb-lv" id="enemy-lv">Lv.1</span></div>
      <div class="hpbar"><i id="enemy-hp"></i></div>
      <div class="sb-bot"><span>HP</span><span class="hptext" id="enemy-hptext"></span></div>
    </div>
    <div class="slot" id="enemy-slot"><div class="platform"></div><div id="enemy-sprite"></div></div>
    <!-- 히어로 -->
    <div class="slot" id="hero-slot"><div class="platform"></div><div id="hero-card"><img id="hero-img" alt=""></div></div>
    <div class="statbox" id="hero-box">
      <div class="sb-top"><span class="sb-name" id="hero-name">거지</span><span class="sb-lv" id="hero-lv">Lv.1</span></div>
      <div class="hpbar"><i id="hero-hp"></i></div>
      <div class="sb-bot"><span id="hero-wep">🌿 나뭇가지</span><span class="hptext" id="hero-hptext"></span></div>
      <div class="hpbar mp"><i id="hero-mp"></i></div>
    </div>
  </div>

  <!-- 하단 텍스트/커맨드 -->
  <div id="textbox">
    <div id="msg"></div>
    <div id="cmd"></div>
  </div>

  <div id="flash"></div>

  <!-- 타이틀 -->
  <div class="screen show" id="title">
    <div class="scene"><img class="bg" id="title-bg" alt=""><div class="tint"></div><div class="vig"></div></div>
    <h1>그림자<br>서약</h1>
    <div class="en">SHADOW'S OATH</div>
    <div class="desc">버림받은 거지가 악신의 속삭임에 손을 뻗는다.<br>타락한 천사들을 베고 권능을 삼켜라.<br>끝에서 너를 기다리는 건 악신의 제단.</div>
    <button class="bigbtn" id="start-btn"><div class="m">시작</div><div class="s">BEGIN THE OATH</div></button>
  </div>

  <!-- 스토리 -->
  <div class="screen" id="story">
    <div class="scene"><img class="bg" id="story-bg" alt=""><div class="tint"></div><div class="vig"></div></div>
    <div class="story-panel"><div class="rgn" id="story-en">FORGOTTEN FOREST</div><div class="rgn-kr" id="story-kr">잊혀진 숲</div><p id="story-text"></p></div>
    <div class="tap-hint">화면을 탭하여 계속</div>
  </div>

  <!-- 진화 -->
  <div class="screen" id="evolve">
    <div class="evo-rays"></div>
    <div class="big-title">각 성</div>
    <div class="evo-hero"><img id="evo-img" alt=""></div>
    <div class="sub-title" id="evo-name"></div>
    <div class="note" id="evo-note"></div>
    <div class="tap-hint">화면을 탭하여 계속</div>
  </div>

  <!-- 게임오버 -->
  <div class="screen" id="gameover">
    <div class="big-title">SHADOW FADES</div>
    <div class="sub-title">그림자가 스러졌다</div>
    <div class="note" id="go-note"></div>
    <button class="bigbtn" id="retry-btn"><div class="m">다시</div><div class="s">RISE AGAIN</div></button>
  </div>

  <!-- 승리 -->
  <div class="screen" id="win">
    <div class="scene"><img class="bg" id="win-bg" alt=""><div class="tint"></div><div class="vig"></div></div>
    <div class="big-title">악신의 후계자</div>
    <div class="sub-title">HEIR OF THE EVIL GOD</div>
    <div class="note" id="win-note"></div>
    <button class="bigbtn" id="win-btn"><div class="m">다시</div><div class="s">NEW OATH</div></button>
  </div>
</div>

    <path d="M100 58 C86 58 80 70 80 84 L74 150 C74 160 126 160 126 150 L120 84 C120 70 114 58 100 58 Z" fill="${pal.robe}" stroke="#000" stroke-width="2.5"/>
    <ellipse cx="100" cy="70" rx="15" ry="17" fill="#0b0718"/>
    <circle cx="93" cy="70" r="3.2" fill="${pal.eye}"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="107" cy="70" r="3.2" fill="${pal.eye}"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
    <g transform="rotate(18 128 120)"><rect x="125" y="86" width="6" height="70" rx="3" fill="${boss?'#ffcf3f':pal.wing}" stroke="#000" stroke-width="1.5"/><rect x="118" y="150" width="20" height="6" rx="2" fill="#3a2456" stroke="#000" stroke-width="1.5"/></g>
  </svg><style>@keyframes wingflap{0%,100%{transform:scaleX(1);}50%{transform:scaleX(.9);}}</style>`;
}

/* ===================== 상태 ===================== */
let hero, region, sub, enemy, guardOn, busy, awaiting;
function baseHero(){ return { form:0, level:1, xp:0, xpNext:20, gold:0, gem:0, potions:3, maxHp:60, hp:60, maxMp:20, mp:20, atk:10, def:4 }; }

const $=id=>document.getElementById(id);
function setBar(el,cur,max){ $(el).style.width=Math.max(0,Math.min(100,cur/max*100))+'%'; }
function scene(bgKey){ $('scene-bg').src=ASSETS[bgKey]; }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show')); if(id) $(id).classList.add('show'); }

/* ===================== 흐름 ===================== */
function newGame(){ hero=baseHero(); region=0; sub=0; showScreen(null); startRegion(); }
function startRegion(){
  const r=REGIONS[region]; scene(r.bg); $('stage-pill').textContent=r.kr; sub=0;
  $('story-bg').src=ASSETS[r.bg]; $('story-en').textContent=r.en; $('story-kr').textContent=r.kr; $('story-text').textContent=r.story;
  showScreen('story'); awaiting=()=>{ showScreen(null); nextBattle(); };
}
function nextBattle(){ startBattle(sub >= REGIONS[region].mobs); }

function startBattle(isBoss){
  const r=REGIONS[region], tier=Math.min(region,4);
  if(isBoss){ enemy={ name:r.boss, isBoss:true, lv:region*2+3, maxHp:Math.round(90+region*70+(region===5?200:0)), atk:Math.round(12+region*6), def:Math.round(4+region*3), xp:40+region*30, gold:30+region*25, gem:1 }; }
  else { const names=['길잃은 천사','타락한 정찰천사','부서진 날개의 천사','성가 잃은 천사']; enemy={ name:names[(region+sub)%names.length], isBoss:false, lv:region*2+1+sub, maxHp:Math.round(45+region*38+sub*10), atk:Math.round(8+region*4), def:Math.round(2+region*2), xp:14+region*10, gold:10+region*8, gem:0 }; }
  enemy.hp=enemy.maxHp;
  $('enemy-name').textContent=enemy.name; $('enemy-lv').textContent='Lv.'+enemy.lv;
  const es=$('enemy-sprite'); es.className=''; es.innerHTML=angelSVG(tier,enemy.isBoss);
  setBar('enemy-hp',enemy.hp,enemy.maxHp); $('enemy-hptext').textContent=enemy.hp+'/'+enemy.maxHp;
  guardOn=false; busy=false; refreshHero();
  msg(enemy.isBoss?'⚔ 보스 '+enemy.name+'이(가) 나타났다!':'야생의 '+enemy.name+'이(가) 나타났다!', enemy.isBoss);
  showCommands();
}

function refreshHero(){
  const f=FORMS[hero.form];
  $('hero-img').src=ASSETS[f.img];
  $('hero-name').textContent=f.name; $('hero-lv').textContent='Lv.'+hero.level; $('hero-wep').textContent=f.wep;
  setBar('hero-hp',hero.hp,hero.maxHp); $('hero-hptext').textContent=hero.hp+'/'+hero.maxHp; setBar('hero-mp',hero.mp,hero.maxMp);
  $('ui-gold').textContent=hero.gold; $('ui-gem').textContent=hero.gem;
}
function heroAtk(){ return hero.atk + FORMS[hero.form].wAtk; }

/* ===================== 커맨드 (포켓몬식) ===================== */
function showCommands(){
  $('cmd').innerHTML=`<div class="cmd-grid">
    <button class="cbtn fight" data-a="fight"><span class="ci">⚔</span>싸우다</button>
    <button class="cbtn bag" data-a="bag"><span class="ci">🎒</span>가방</button>
    <button class="cbtn guard" data-a="guard"><span class="ci">🛡</span>방어</button>
    <button class="cbtn flee" data-a="flee"><span class="ci">🏃</span>도망</button>
  </div>`;
}
function showMoves(){
  const f=FORMS[hero.form];
  let h='<div class="move-grid">';
  h+=`<button class="mbtn basic" data-a="basic"><div class="mn">${f.wep.split(' ')[1]||'공격'}</div><div class="md">기본 무기 공격</div><div class="mc">MP 0</div></button>`;
  for(const p of POWERS){ if(hero.form<p.unlock) continue; const dis=hero.mp<p.mp?'disabled':'';
    h+=`<button class="mbtn" data-sk="${p.id}" ${dis}><div class="mn" style="color:${p.color}">${p.name}</div><div class="md">${p.desc}</div><div class="mc">MP ${p.mp}</div></button>`; }
  h+='<button class="mback" data-a="back">◀ 뒤로</button></div>';
  $('cmd').innerHTML=h;
}
function showBag(){
  let h='<div class="move-grid">';
  h+=`<button class="mbtn basic" data-a="usepotion" ${hero.potions<=0?'disabled':''}><div class="mn">🧪 치유 물약 ×${hero.potions}</div><div class="md">HP 45% 회복</div></button>`;
  h+='<button class="mbtn" disabled><div class="md">그 외엔 없다…</div></button>';
  h+='<button class="mback" data-a="back">◀ 뒤로</button></div>';
  $('cmd').innerHTML=h;
}
$('cmd').addEventListener('click',e=>{
  if(busy) return; const b=e.target.closest('[data-a],[data-sk]'); if(!b||b.disabled) return;
  const a=b.dataset.a;
  if(a==='fight') showMoves();
  else if(a==='bag') showBag();
  else if(a==='guard') playerGuard();
  else if(a==='flee') playerFlee();
  else if(a==='back') showCommands();
  else if(a==='basic') playerAttack();
  else if(a==='usepotion') playerItem();
  else if(b.dataset.sk) playerSkill(b.dataset.sk);
});

/* ===================== 전투 로직 ===================== */
function rollDmg(atk,def){ const base=Math.max(1,atk-def*0.6); return Math.max(1,Math.round(base*(0.85+Math.random()*0.3))); }
function msg(t,big){ const m=$('msg'); m.textContent=t; m.className=big?'big':''; }
function popDmg(x,y,val,cls){ const d=document.createElement('div'); d.className='dmg '+(cls||''); d.textContent=val; d.style.left=x+'px'; d.style.top=y+'px'; $('game').appendChild(d); setTimeout(()=>d.remove(),1000); }
function flash(){ const f=$('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function shakeIt(){ const g=$('game'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); }

function playerAttack(){ doPlayerDamage(heroAtk(),1,false,'그림자의 '+(FORMS[hero.form].wep.split(' ')[1]||'공격')+' 공격!'); }
function playerSkill(id){ const p=POWERS.find(x=>x.id===id); if(!p||hero.mp<p.mp) return; hero.mp-=p.mp; refreshHero(); doPlayerDamage(heroAtk(),p.mult,p.type==='drain'?'drain':'skill','✦ '+p.name+'!',p); }
function playerGuard(){ busy=true; guardOn=true; showCommands(); msg('🛡 방어 태세! 받는 피해가 줄어든다.'); setTimeout(enemyTurn,650); }
function playerFlee(){ busy=true; showCommands(); msg(enemy.isBoss?'도망칠 수 없다! 서약이 발목을 붙든다.':'물러설 곳은 없다… 그림자는 도망치지 않는다.'); setTimeout(enemyTurn,750); }
function playerItem(){ if(hero.potions<=0) return; if(hero.hp>=hero.maxHp){ msg('이미 체력이 가득하다.'); return; }
  busy=true; hero.potions--; const heal=Math.round(hero.maxHp*0.45); hero.hp=Math.min(hero.maxHp,hero.hp+heal); refreshHero(); showCommands();
  const c=$('hero-card').getBoundingClientRect(),g=$('game').getBoundingClientRect(); popDmg(c.left-g.left+50,c.top-g.top+40,'+'+heal,'heal'); msg('🧪 물약을 마셨다. HP +'+heal); setTimeout(enemyTurn,750); }

function doPlayerDamage(atk,mult,mode,text,power){
  busy=true; msg(text); showCommands();
  const es=$('enemy-sprite'); es.classList.add('hit'); flash(); shakeIt();
  let dmg=Math.round(rollDmg(atk,enemy.def)*mult); const crit=Math.random()<0.18; if(crit) dmg=Math.round(dmg*1.6);
  enemy.hp=Math.max(0,enemy.hp-dmg);
  const r=es.getBoundingClientRect(),g=$('game').getBoundingClientRect();
  popDmg(r.left-g.left+r.width/2-10,r.top-g.top+40,dmg,crit?'crit':'');
  if(mode==='drain'){ const heal=Math.round(dmg*0.5); hero.hp=Math.min(hero.maxHp,hero.hp+heal); const c=$('hero-card').getBoundingClientRect(); popDmg(c.left-g.left+50,c.top-g.top+40,'+'+heal,'heal'); }
  setBar('enemy-hp',enemy.hp,enemy.maxHp); $('enemy-hptext').textContent=enemy.hp+'/'+enemy.maxHp; refreshHero();
  setTimeout(()=>{ es.classList.remove('hit'); if(enemy.hp<=0) enemyDefeated(); else enemyTurn(); },520);
}
function enemyTurn(){
  if(enemy.hp<=0){ enemyDefeated(); return; }
  busy=true;
  const strong=enemy.isBoss&&Math.random()<0.35;
  setTimeout(()=>{
    let dmg=rollDmg(enemy.atk*(strong?1.7:1),hero.def); if(guardOn) dmg=Math.round(dmg*0.4);
    hero.hp=Math.max(0,hero.hp-dmg); $('hero-card').classList.add('hit'); shakeIt();
    const c=$('hero-card').getBoundingClientRect(),g=$('game').getBoundingClientRect(); popDmg(c.left-g.left+50,c.top-g.top+30,dmg,'mine');
    msg(strong?'💢 '+enemy.name+'의 강력한 일격!':enemy.name+'의 공격!');
    setBar('hero-hp',hero.hp,hero.maxHp); $('hero-hptext').textContent=hero.hp+'/'+hero.maxHp;
    setTimeout(()=>{ $('hero-card').classList.remove('hit'); guardOn=false;
      if(hero.hp<=0) gameOver(); else { hero.mp=Math.min(hero.maxMp,hero.mp+5); busy=false; refreshHero(); msg('무엇을 할까?'); showCommands(); }
    },430);
  },strong?520:430);
}
function enemyDefeated(){
  busy=true; $('enemy-sprite').classList.add('dead');
  hero.gold+=enemy.gold; hero.gem+=(enemy.gem||0); gainXp(enemy.xp);
  msg('✦ '+enemy.name+' 처치! +'+enemy.xp+' EXP · +'+enemy.gold+'G'+(enemy.gem?' · +'+enemy.gem+'✦':''));
  setTimeout(()=>{ const r=REGIONS[region]; sub++; if(sub>r.mobs) afterRegionClear(); else { refreshHero(); nextBattle(); } },1150);
}
function gainXp(x){ hero.xp+=x; while(hero.xp>=hero.xpNext){ hero.xp-=hero.xpNext; hero.level++; hero.xpNext=Math.round(hero.xpNext*1.4); hero.maxHp+=14; hero.hp=hero.maxHp; hero.maxMp+=4; hero.mp=hero.maxMp; hero.atk+=3; hero.def+=1; } }

function afterRegionClear(){
  if(region>=REGIONS.length-1){ winGame(); return; }
  region++; hero.form=Math.min(FORMS.length-1,region); hero.maxHp+=20; hero.hp=hero.maxHp; hero.maxMp+=6; hero.mp=hero.maxMp; hero.atk+=4; hero.def+=2; hero.potions+=2;
  const f=FORMS[hero.form]; $('evo-img').src=ASSETS[f.img]; $('evo-name').textContent=f.name+' — '+f.wep;
  let extra=''; const p=POWERS.find(pp=>pp.unlock===hero.form); if(p) extra=' 새로운 권능 「'+p.name+'」을(를) 얻었다.';
  $('evo-note').textContent=f.note+extra;
  document.querySelector('#evolve .big-title').textContent=hero.form>=5?'악신의 후계자':'각 성';
  showScreen('evolve'); awaiting=()=>{ showScreen(null); startRegion(); };
}
function gameOver(){ busy=true; $('go-note').textContent=REGIONS[region].kr+'에서 그림자가 흩어졌다. '+FORMS[hero.form].name+' · Lv.'+hero.level; showScreen('gameover'); }
function winGame(){ $('win-bg').src=ASSETS[REGIONS[5].bg]; $('win-note').textContent='악신의 그림자를 삼키고, 너 자신이 악신의 후계자가 되었다. 제단의 옥좌가 마침내 주인을 맞이한다.'; showScreen('win'); }

function tapContinue(){ if(awaiting){ const f=awaiting; awaiting=null; f(); } }
$('story').addEventListener('click',tapContinue);
$('evolve').addEventListener('click',tapContinue);
$('start-btn').addEventListener('click',newGame);
$('retry-btn').addEventListener('click',newGame);
$('win-btn').addEventListener('click',newGame);
$('title-bg').src=ASSETS.bg0;
</script>
</body>
</html>
